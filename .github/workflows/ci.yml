name: Test Suite

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: 🚀 Levantar servidor en segundo plano
        run: |
          # Iniciamos reflex y lo mandamos al background
          reflex run --env dev & 
          
          # Esperamos a que el puerto 3000 responda (máximo 5 min)
          timeout 300 bash -c 'until printf "" 2>>/dev/null >>/dev/tcp/127.0.0.1/3000; do sleep 5; done'
          echo "✅ ¡Servidor de TennisTournament listo!"

      - name: Run tests
        run: pytest