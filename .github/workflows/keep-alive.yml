name: Keep Alive

on:
  schedule:
    # Cada 10 min: Render duerme tras 15 min sin tráfico y los crons de
    # GitHub Actions pueden retrasarse varios minutos, así que dejamos margen.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping app en Render
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 30 \
            -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            https://tennistournament-98ar.onrender.com/
