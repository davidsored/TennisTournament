[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short
markers =
    unit: tests unitarios puros (sin DB, sin Reflex, sin red)
    integration: tests de integración (DB en memoria, mocks de rx.session)
    e2e: tests end-to-end con Playwright (requieren app corriendo en localhost:3000)
filterwarnings =
    ignore::DeprecationWarning
